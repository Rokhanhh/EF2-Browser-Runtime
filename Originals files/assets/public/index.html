<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <title>ElfDefender</title>
        <style>
            :root {
                --safe-area-inset-top: env(safe-area-inset-top);
                --safe-area-inset-bottom: env(safe-area-inset-bottom);
            }

            * {
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }

            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                width: 100%;
                height: 100%;
                background-color: #000000;
                position: fixed;
                touch-action: none;
            }

            canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                display: block;
                box-sizing: border-box;
                touch-action: none;
            }

            /* 스플래시 화면 */
            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            .splash-content {
                width: 100%;
                max-width: 640px;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
                box-sizing: border-box;
            }

            .splash-title {
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                font-size: 24px;
                font-weight: bold;
                margin-bottom: 30px;
            }

            .status-text {
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                font-size: 14px;
                text-align: center;
                margin-top: 20px;
                line-height: 1.5;
            }

            .progress-container {
                width: 100%;
                max-width: 300px;
                margin-top: 30px;
                display: none;
            }

            .progress-container.active {
                display: block;
            }

            .progress-bar {
                width: 100%;
                height: 8px;
                background-color: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                overflow: hidden;
                margin-bottom: 10px;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #4ecdc4, #44a08d);
                border-radius: 4px;
                width: 0%;
                transition: width 0.3s ease;
            }

            .progress-info {
                display: flex;
                justify-content: space-between;
                color: rgba(255, 255, 255, 0.7);
                font-size: 12px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            }

            .progress-percent {
                font-weight: 600;
                color: #4ecdc4;
            }

            .download-info {
                margin-top: 15px;
                color: rgba(255, 255, 255, 0.6);
                font-size: 14px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                text-align: center;
                display: none;
            }

            .download-info.active {
                display: block;
            }

            .fade-out {
                animation: fadeOut 0.3s ease-out forwards;
            }

            @keyframes fadeOut {
                to {
                    opacity: 0;
                    visibility: hidden;
                }
            }

            #htmlOverlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 1;
                box-sizing: border-box;
            }
        </style>
        <script src="gameLoader.js"></script>
    </head>
    <body>
        <!-- 스플래시 화면 -->
        <div id="splash-screen">
            <div class="splash-content">
                <div class="splash-title">Endless Frontier 2</div>
                <div class="status-text" id="status-text">Loading...</div>

                <div class="progress-container" id="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progress-size">0 MB / 0 MB</span>
                        <span class="progress-percent" id="progress-percent">0%</span>
                    </div>
                </div>

                <div class="download-info" id="download-info"></div>
            </div>
        </div>

        <div id="app"></div>
        <div id="htmlOverlay"></div>

        <script>
            // 스플래시 화면 제어 함수들
            window.updateSplashStatus = function (text) {
                const el = document.getElementById('status-text');
                if (el) el.textContent = text;
            };

            window.hideSplashScreen = function () {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => splash.remove(), 300);
                }
            };

            window.formatFileSize = function (bytes) {
                if (bytes < 1024 * 1024) {
                    return (bytes / 1024).toFixed(1) + ' KB';
                }
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            };

            window.showDownloadProgress = function (fileName, fileSize, downloadType) {
                const container = document.getElementById('progress-container');
                const info = document.getElementById('download-info');
                const size = document.getElementById('progress-size');
                const percent = document.getElementById('progress-percent');
                const fill = document.getElementById('progress-fill');

                if (container) container.classList.add('active');
                if (info) {
                    info.classList.add('active');
                    const typeText = downloadType === 'main' ? 'Main Bundle' : 'Update Bundle';
                    info.textContent = `${typeText} Downloading...`;
                }
                if (size) size.textContent = `0 MB / ${window.formatFileSize(fileSize)}`;
                if (percent) percent.textContent = '0%';
                if (fill) fill.style.width = '0%';
            };

            window.updateDownloadProgress = function (progress) {
                const size = document.getElementById('progress-size');
                const percent = document.getElementById('progress-percent');
                const fill = document.getElementById('progress-fill');

                if (size && progress.totalBytes > 0) {
                    size.textContent = `${window.formatFileSize(progress.downloadedBytes)} / ${window.formatFileSize(progress.totalBytes)}`;
                }
                if (percent) percent.textContent = `${progress.percent}%`;
                if (fill) fill.style.width = `${progress.percent}%`;
            };

            window.updateDownloadComplete = function (fileName, fileSize) {
                const size = document.getElementById('progress-size');
                const percent = document.getElementById('progress-percent');
                const fill = document.getElementById('progress-fill');
                const info = document.getElementById('download-info');
                const formatted = window.formatFileSize(fileSize);

                if (size) size.textContent = `${formatted} / ${formatted}`;
                if (percent) percent.textContent = '100%';
                if (fill) fill.style.width = '100%';
                if (info) info.textContent = 'Download Complete!';

                setTimeout(() => {
                    const container = document.getElementById('progress-container');
                    if (container) container.classList.remove('active');
                    if (info) info.classList.remove('active');
                }, 1000);
            };
        </script>
    </body>
</html>
